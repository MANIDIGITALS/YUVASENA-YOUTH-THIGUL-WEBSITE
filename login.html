<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Login | YUVASENA YOUTH THIGUL</title>
<meta name="description" content="Member login for YUVASENA YOUTH, Thigul.">
<meta property="og:title" content="Member Login | YUVASENA YOUTH THIGUL">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFDF8; --cream:#F8F1E5; --orange:#F36B21; --maroon:#7A1F1F; --gold:#D89B32;
    --text:#222222; --text-soft:#6b625c; --line:rgba(122,31,31,0.10);
    --shadow:0 10px 30px rgba(122,31,31,0.07); --radius:14px; --max:1160px;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--text); font-family:'Karla',sans-serif; line-height:1.6;
    -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; min-height:100vh;
  }
  h1,h2{ font-family:'Fraunces',serif; margin:0; color:var(--maroon); font-weight:600; letter-spacing:-0.01em; }
  a{ color:inherit; text-decoration:none; }
  a:focus-visible, button:focus-visible, input:focus-visible{ outline:2px solid var(--orange); outline-offset:3px; }

  .top-link{
    padding:22px 24px; display:flex; justify-content:center;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark{ width:44px; height:44px; }
  .brand-text{ display:flex; flex-direction:column; line-height:1.15; text-align:left; }
  .brand-text strong{ font-family:'Fraunces',serif; font-size:17px; color:var(--maroon); }
  .brand-text span{ font-size:11px; letter-spacing:0.14em; color:var(--gold); font-weight:700; }

  main{ flex:1; display:flex; align-items:center; justify-content:center; padding:20px 20px 60px; }

  .login-card{
    width:100%; max-width:420px; background:var(--bg); border:1px solid var(--line);
    border-radius:18px; padding:40px 34px; box-shadow:var(--shadow); position:relative;
  }
  .login-card::before{
    content:""; position:absolute; top:0; left:24px; right:24px; height:3px; background:var(--gold); border-radius:0 0 4px 4px;
  }
  .login-head{ text-align:center; margin-bottom:28px; }
  .login-head h1{ font-size:26px; }
  .login-head p{ color:var(--text-soft); font-size:13.5px; margin-top:8px; }

  .field{ margin-bottom:18px; }
  .field label{ display:block; font-size:12.5px; font-weight:700; letter-spacing:0.04em; color:var(--maroon); margin-bottom:7px; }
  .field input{
    width:100%; padding:13px 14px; border:1.5px solid var(--line); border-radius:9px;
    font-family:'Karla',sans-serif; font-size:14.5px; color:var(--text); background:#fff;
    transition:border-color .15s ease;
  }
  .field input:focus{ border-color:var(--gold); outline:none; }

  .row-between{ display:flex; align-items:center; justify-content:space-between; margin:6px 0 24px; font-size:13px; }
  .remember{ display:flex; align-items:center; gap:8px; color:var(--text-soft); }
  .remember input{ accent-color:var(--orange); width:15px; height:15px; }
  .forgot{ color:var(--maroon); font-weight:700; }
  .forgot:hover{ text-decoration:underline; }

  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; font-weight:700; font-size:13px; letter-spacing:0.06em; padding:14px 28px; border-radius:9px; cursor:pointer; border:1.5px solid transparent; width:100%; transition:transform .15s ease, background .15s ease; }
  .btn:hover{ transform:translateY(-1px); }
  .btn-primary{ background:var(--orange); color:#fff; }
  .btn-primary:hover{ background:#da5b16; }

  .divider-note{
    text-align:center; margin-top:24px; font-size:12.5px; color:var(--text-soft);
    padding-top:20px; border-top:1px solid var(--line);
  }

  .info-note{
    background:var(--cream); border-radius:10px; padding:12px 14px; font-size:12px;
    color:var(--text-soft); margin-top:22px; text-align:center;
  }

  footer{ text-align:center; padding:24px; font-size:12px; color:var(--text-soft); }
</style>
</head>
<body>

<!--
  DEVELOPER NOTE:
  This is a static markup shell for the login page. Wire the form
  submit handler below to Supabase Auth (supabase.auth.signInWithPassword)
  once the backend is connected, and redirect on success to
  /member/dashboard. Do not expose any service-role key client-side.
-->

<div class="top-link">
  <a href="index.html" class="brand" aria-label="YUVASENA YOUTH THIGUL home">
        <img class="brand-mark" src="https://i.ibb.co/JwGGRGqm/LOGO-BG-ROMOVE.png" alt="YUVASENA YOUTH THIGUL logo" >
    <span class="brand-text"><strong>YUVASENA YOUTH</strong><span>THIGUL</span></span>
  </a>
</div>

<main>
  <div class="login-card">
    <div class="login-head">
      <h1>MEMBER LOGIN</h1>
      <p>Sign in to view announcements, events and your membership details.</p>
    </div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="identifier">Email / Mobile</label>
        <input type="text" id="identifier" name="identifier" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <div class="row-between">
        <label class="remember">
          <input type="checkbox" id="remember" name="remember">
          Remember Me
        </label>
        <a href="#" class="forgot">Forgot Password?</a>
      </div>
      <button type="submit" class="btn btn-primary">LOGIN</button>
    </form>

    <div class="info-note">
      Member accounts are created by the association. Contact us if you need access.
    </div>
  </div>
</main>

<footer>© 2026 YUVASENA YOUTH – THIGUL</footer>

<script>
  const form = document.getElementById('loginForm');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    // DEVELOPER NOTE: replace with real Supabase Auth call, e.g.:
    // const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    // if (!error) window.location.href = '/member/dashboard';
    alert('Login is not yet connected to a backend. This page is a static template.');
  });
</script>
</body>
</html>
